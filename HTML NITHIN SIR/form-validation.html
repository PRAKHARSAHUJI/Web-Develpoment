<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:required +span
        {
            display: inline;
            color: red;
        }
        input:optional+span
        {
            display: none;
        }
        input:valid+span
        {
            display: none;;
        }
    </style>
</head>


<body>
    
    <form>
        <dl>
            <dt>Username</dt>
            <dd>
                <input type="text" name = "txtUsername"><span>*</span>
            </dd>
        </dl>
        <dl>
            <dt>Password</dt>
            <dd>
                <input type="password" name = "userpass" required><span>*</span>
            </dd>
        </dl>
        <dl>
            <dt>Age</dt>
            <dd>
                <input type="text" name = "txtUserAge"><span>*</span>
            </dd>
        </dl>
    </form>
</body>
</html>
