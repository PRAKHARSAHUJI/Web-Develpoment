<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont
        {
            height: 400px;
            width: 700px;
            background-image: url("https://yevgenysim-turkey.github.io/shopper/assets/img/products/product-2.jpg");
            background-size: cover;
            position: relative;
        }
        .offer
        {
            background-color: red;
            width: 40px;
            height: 40px;
            position: absolute;
            padding: 20px;
            border-radius: 40px;
            top: -10px;
            right: -10px;
        }
    </style>
</head>
<body>
    
    <div class="cont">
        <div class="offer">
            <span>30 % off</span>
        </div>
    </div>

</body>
</html>
