<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    main {
        display: grid;
        grid-template-columns: 4fr 4fr 4fr;
        height: 550px;
        grid-gap: 2px;
    }

    .Womenfashion {
        background-image: url(https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-1.jpg);
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .Womenfashion:hover{
        opacity: 0.5;
    }
    
    .Mensfashion {
        background-image: url(https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-2.jpg);
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .Mensfashion:hover{
        opacity: 0.5;
    }
    .Kidsfashion {
        background-image: url(https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-3.jpg);
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .Kidsfashion:hover{
        opacity: 0.5;
    }
    .header
    {
        color: white;
        font-size: 50px;
    }
    button
    {
        background-color: white;
        color: black;
        height: 50px;
        width: 130px;
        /* align-items: center; */
        text-align: center;
        border: none;
        margin-top: 200px;
        /* margin-left: 80px; */
    }
</style>

<body>

    <main>

        <div class="Womenfashion">
            <!-- <img src="https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-1.jpg" alt=""  > -->

            <div class="card">
                <div class="header">
                    WOMEN
                </div>
                <div class="footer">
                    <button>Shop Women</button>
                </div>
            </div>

        </div>

        <div class="Mensfashion">
            <!-- <img src="https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-2.jpg" alt="" > -->

            <div class="card">
                <div class="header">
                    MEN
                </div>
                <div class="footer">
                   <button>Shop Men</button>

                </div>
            </div>

        </div>

        <div class="Kidsfashion">
            <!-- <img src="https://yevgenysim-turkey.github.io/shopper/assets/img/covers/cover-3.jpg" alt="" > -->

            <div class="card">
                <div class="header">
                    KIDS
                </div>
                <div class="footer">
                    <button>Shop Kids</button>
                </div>
            </div>

        </div>

    </main>

</html>
