<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input+div
        {
            display: none;
        }
        input::placeholder
        {
            color: blue;
            font-weight: bold;
            font-size: 12px;
        }
        input:focus+div{
            color: black;
            display: block;
        }
        
    </style>
</head>
<body>
    
    <form>
        <dl>
            <dt>
                Username
            </dt>
            <dd>
                <input type="text" name="" id="" placeholder="Enter Username">
                <div>
                    <span>i</span>Username in UPPERCASE
                </div>
            </dd>

        </dl>
    </form>
</body>
</html>
